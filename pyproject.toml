[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mebby-telegram-bot"
version = "1.0.0"
description = "Mebby: Curated English Learning Telegram Bot with 1,000 Exercises and Gemini AI Coaching"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Mebby Team" }
]
dependencies = [
    "python-telegram-bot>=21.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "google-genai>=1.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
